# Packaged QligFEP configuration. Do not edit this file: override it instead.
#
#   user file     ~/.config/qligfep/config.yaml (or $QLIGFEP_CONFIG)   -> profiles only
#   project file  ./qligfep.yaml (or --config PATH)                    -> profiles and protocols
#
# Later layers are merged onto earlier ones key by key, so a user file only needs the
# keys it changes, e.g. `profiles: {TETRA: {slurm: {account: my-project}}}`.
# Run `qligfep_config show` to see the resolved result and `qligfep_config init` to
# generate a commented user file for this machine.
version: 1

# Profile used when -c/--profile is not given. Unset here on purpose.
default_profile: null
# Protocol used when --protocol is not given.
default_protocol: default

# ---------------------------------------------------------------------------------
# Profiles: WHERE and HOW jobs run. They must never change the simulated physics.
# The site profiles below are the historical `settings.py` clusters, kept so that
# existing `-c NAME` commands keep working. Module names are examples from development
# and are not guaranteed to still be valid at those sites. No profile sets an account:
# the project allocation is yours to choose, with `slurm.account` in your own
# configuration or `--account` on the command line.
# ---------------------------------------------------------------------------------
profiles:
  CSB:
    execution: slurm-array
    setup: module purge
    modules: [Q/6.0.1_ME]
    resources: {ntasks: 8, time: "0-12:00:00", mem_per_cpu: null}

  SNELLIUS:
    execution: slurm-array
    setup: module purge
    modules: ["2023", AOCC/4.0.0-GCCcore-12.3.0, OpenMPI/4.1.5-GCC-12.3.0]
    resources: {ntasks: 16, time: "0-08:00:00"}
    slurm: {partition: rome}

  ALICE:
    execution: slurm-array
    modules: [OpenMPI/3.1.3-GCC-8.2.0-2.31.1]
    resources: {ntasks: 24, time: "0-3:00:00"}

  HEBBE:
    execution: slurm-array
    modules: [GCC/5.4.0-2.26, OpenMPI/1.10.3]
    resources: {ntasks: 20, time: "0-02:00:00"}

  KEBNE:
    execution: slurm-array
    modules: [gompi/2017b]
    resources: {ntasks: 28, time: "0-04:00:00"}

  STALLO:
    execution: slurm-array
    modules: [impi/2018.1.163-iccifort-2018.1.163-GCC-6.4.0-2.28]
    resources: {ntasks: 20, time: "0-12:00:00"}

  UPPMAX:
    execution: slurm-array
    modules: [gcc/9.2.0, openmpi/4.0.2]
    resources: {ntasks: 20, time: "0-24:00:00"}

  TETRA:
    execution: slurm-array
    resources: {ntasks: 8, time: "0-06:00:00"}

  DARDEL:
    execution: slurm-array
    resources: {ntasks: 8, time: "0-06:00:00"}
    slurm: {partition: shared}

  HABROK:
    execution: slurm-array
    setup: module purge
    modules: [OpenMPI/4.1.4-GCC-11.3.0]
    resources: {ntasks: 8, time: "0-08:00:00"}

  # Serial engine on this machine, one replicate at a time.
  LOCAL:
    execution: local
    engine: qdyn
    resources: {ntasks: 1, time: "0-24:00:00"}

  # MPI engine on this machine, using every core.
  LOCALP:
    execution: local
    engine: qdynp
    resources: {ntasks: auto, time: "0-24:00:00"}

# ---------------------------------------------------------------------------------
# Protocols: WHAT is simulated. Define your own in the project file with
# `extends: default` and only the keys you change.
# ---------------------------------------------------------------------------------
protocols:
  default:
    description: Windowed equilibrium FEP with the standard QligFEP settings.
    # equilibrium    -> fixed-lambda windows analysed with qfep (uses `equilibrium:`)
    # nonequilibrium -> fast forward/reverse lambda switches analysed with BAR
    #                   (uses `nonequilibrium:`; `equilibrium:` keys do not apply)
    method: equilibrium
    timestep: 2fs            # 1fs | 2fs
    temperature: 298         # K; a list runs several temperatures
    replicates: 10
    sphere_radius: 25        # Angstrom
    equilibrium:
      windows: 100
      sampling: sigmoidal    # linear | sigmoidal | exponential | reverse_exponential
      start: 0.5             # 0.5 (middle, both directions) | 1 (endpoint)
      # lambdas: [0, 0.1, 0.5, 0.9, 1]   an explicit list instead of windows + sampling;
      #                                  must hold 0, 1 and the start window
    nonequilibrium:
      switch_pairs: 5        # forward/reverse switch pairs per replicate
      schedule: sigmoidal    # sigmoidal | linear
      steepness: 8.0         # L of the sigmoidal schedule
    # Per-stage overrides. Stage names:
    #   both methods:    eq1 eq2 eq3 eq4 eq5
    #   equilibrium:     production            (each lambda window)
    #   nonequilibrium:  relax spacing switch  (endpoint relaxation, spacing between
    #                                           switches, the lambda switch itself)
    # Each stage accepts:
    #   time: 100ps        length as a duration (fs/ps/ns), converted with the stage stepsize
    #   steps: 50000       or the length directly in MD steps
    #   inp:               any qdyn input keyword, addressed as section -> key
    #     MD: {bath_coupling: 5}
    #     intervals: {trajectory: 500}
    stages: {}
